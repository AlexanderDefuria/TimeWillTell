[project]
name = "scvd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.0, <3.13"
dependencies = [
    "accelerate>=1.8.1",
    "gdown>=5.2.0",
    "graphviz>=0.20.3",
    "bitsandbytes~=0.47.0",
    "huggingface-hub>=0.31.4",
    "matplotlib>=3.10.0",
    "networkx>=3.4.2",
    "numpy>=2.2.0",
    "polars>=1.28.0",
    "pyarrow==22.0.0",
    "pydot>=4.0.0",
    "pygit2>=1.16.0",
    "pytorch-lightning[extra]==2.5.3",
    "pytorch-lightning==2.5.3",
    "seaborn>=0.13.0",
    "optuna>=4.4.0",
    "peft==0.18.1",
    "sentencepiece",
    "seaborn>=0.13.2",
    "torch~=2.7.0",
    "torch-geometric>=2.6.1",
    "transformers==5.1.0",
    "pathos==0.3.3",
    "torchdata==0.11.0",
    "scipy>=1.15.1",
    "pexpect>=4.9.0",
    "hf-transfer>=0.1.9",
    "ipython>=9.6.0",
    "contexttimer",
    "tqdm",
    "pathos",
    "scikit-learn>=1.8.0",
    "pytest-xdist>=3.8.0",
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "openai>=1.0",
    "responses",
    "tokenizers==0.22.2",
    "levenshtein==0.27.3",
    "tensorboard>=2.20.0",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "tbparse>=0.0.9",
    "pygit>=0.1",
    "tensorboard-plugin-customizable-plots>=1.1.3",
    "globus-cli>=3.35.2",
    "pyright>=1.1.400",
    "black>=25.1.0",
    "autoread-dotenv>=1.0.3",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "tensorboard>=2.20.0",
    "tree-sitter>=0.25.1",
    "tree-sitter-c>=0.24.1",
    "tree-sitter-cpp>=0.23.4",
    "contexttimer>=0.3.3",
    "datasets>=2.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
filterwarnings = [
    "ignore:builtin type [Ss]wig.*has no __module__:DeprecationWarning",
]

[tool.poetry.plugins]
[tool.poetry.plugins."sitecustomize"]
autoread_dotenv = "autoread_dotenv:entrypoint"



